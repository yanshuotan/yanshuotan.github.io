# publications.yaml
# Source of truth for all publications.
#
# ── Schema ──────────────────────────────────────────────────────────────────
#
#   key          - BibTeX key
#   title        - Full title
#   year         - Publication / preprint year (null if unknown)
#   type         - journal | conference | preprint | thesis | other
#
#   status       - One of:
#                    published       fully published
#                    accepted        accepted, to appear (in press)
#                    preprint        posted preprint, not yet accepted
#
#   review_status  (preprints only) - null | under_review | minor_revision |
#                                     major_revision | RR
#
#   authors      - List of author objects:
#                    name          "Last, First" — use this exact form
#                    equal         true → equal contribution / alphabetical order
#                    supervised    true → student or postdoc I supervised/co-supervised
#                    corresponding true → corresponding author
#
#   venue        - Full venue name
#   venue_short  - Abbreviated venue for CV display (optional)
#   volume, number, pages - Journal metadata (optional)
#   publisher    - Publisher (optional)
#   arxiv        - arXiv ID, e.g. "2307.01932" (optional)
#   doi          - DOI string (optional)
#   url          - Direct link to paper (optional)
#
#   awards       - List of award/distinction strings (optional)
#   notes        - Free-text notes (optional)
#
# ────────────────────────────────────────────────────────────────────────────

