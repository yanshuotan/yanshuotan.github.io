bio: >
  I am an Assistant Professor in the Department of Statistics and Data Science
  at the National University of Singapore, and a Faculty Affiliate with the
  Institute of Data Science and the NUS AI Institute. My research focuses on
  theoretical and applied aspects of statistical machine learning and data
  science, with a particular emphasis on tree-based methods and ensembles,
  Bayesian tree ensemble modeling, and in-context learning for tabular data.

