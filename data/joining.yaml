# joining.yaml
# Content for the "Joining" page, advertising open positions in the group.
#
# *** ALL TEXT BELOW IS PLACEHOLDER — please review and edit before this
#     page goes live. ***
#
# ── Schema ───────────────────────────────────────────────────────────────────
#   intro     (string)  General text on what you look for across all
#                        positions, shown above the list of openings.
#   positions:
#     id            (string)        Unique slug (used as an anchor id)
#     title         (string)        e.g. "PhD Student", "Postdoctoral Researcher"
#     status        (string)        open | closed
#     summary       (string)        One-line teaser shown in the collapsed header
#     description   (list of str)   Paragraphs shown when expanded
#     deadline      (string, opt)   e.g. "Rolling", "31 December 2026"
#     how_to_apply  (string, opt)   Instructions for applying
# ─────────────────────────────────────────────────────────────────────────────

intro: >
  I am always happy to hear from prospective students and researchers who
  are excited about statistical machine learning. Beyond technical
  background, I most value curiosity, persistence in working through hard
  problems, and the ability to communicate ideas clearly and work well with
  others in the group. Specific openings are listed below; if none of them
  fit but you think there's a good match with my research interests, feel
  free to reach out anyway.

positions:

  - id: "phd-student"
    title: "PhD Student"
    status: "open"
    summary: "Fully-funded PhD positions in statistical machine learning."
    description:
      - >
        I am recruiting PhD students to join my group in the Department of
        Statistics and Data Science at NUS. Research directions include tree-based methods and
        ensembles, Bayesian machine learning, interpretability,
        prior-data fitted networks, and agentic data science, though students with their own related
        interests are welcome to discuss other directions.
      - >
        Applicants should have a strong quantitative background (statistics,
        mathematics, computer science, or a related field) and some prior
        exposure to research, e.g. through a thesis, course project, or
        publication. Programming experience in Python or R is helpful but
        not required in advance.
    deadline: "See NUS Department of Statistics and Data Science PhD admissions portal for deadlines"
    how_to_apply: >
      Apply through the <a href="https://www.stat.nus.edu.sg/education/graduate/phd-in-statistics-and-data-science/prospective-students/">NUS Department of Statistics and Data Science PhD
      admissions portal</a>, and also feel free to email me directly with your
      CV, transcript, and a short note on your research interests.

  - id: "postdoc"
    title: "Postdoctoral Research Scholar"
    status: "open"
    summary: "Two-year postdoc position in Bayesian machine learning for healthcare, funded by an NUS Cross Faculty Grant."
    description:
      - >
        I am hiring a postdoctoral research scholar for a two-year
        appointment to develop machine learning solutions for healthcare
        problems, including dynamic treatment regimes, mobile health, and
        trial simulations. The position is funded by an NUS Cross Faculty
        Grant on personalized healthcare via Bayesian machine learning, and
        the successful candidate will be jointly mentored by myself and
        <a href="https://blog.nus.edu.sg/bibhas/">Bibhas Chakraborty</a>
        (Duke-NUS Medical School).
      - >
        The work will draw on Bayesian machine learning techniques,
        including Prior-Data Fitted Networks (PFNs), 
        Bayesian Additive Regression Trees (BART), 
        and generative methods for tabular data.
      - >
        Day-to-day work spans software development, numerical
        experimentation with deep learning, proving theorems, academic
        writing, and communicating with medical collaborators. The postdoc
        will also mentor PhD, master's, and undergraduate students.
      - >
        Ideal candidates have a PhD in statistics, computer science, applied
        mathematics, or a related field, with a deep understanding of
        statistical and computational principles.
    deadline: "Open until filled"
    how_to_apply: >
      Please email me directly with your CV, a brief research statement,
      and contact details for two references.
