    institution: "University of California, Berkeley"
    role: "Instructor"
    level: "Undergraduate"
    semesters: ["Spring 2021"]
    semester_links:
      "Spring 2021": "https://data102.org/sp21"
    enrollment: 250
    description: >
      Capstone course for the data science major. Develops the probabilistic
      foundations of inference in data science and builds a comprehensive view
      of the modeling and decision-making life cycle. Topics include:
      frequentist and Bayesian decision-making, false discovery rate, causal
      inference, general linear modeling, non-parametric modeling, bandits,
      and reinforcement learning.
